    <section class="moments-section">
      <span class="sparkle" style="left:6%;top:20%;color:#e9d29a">✦</span>
      <span class="sparkle" style="right:8%;bottom:20%;color:#e9d29a;animation-delay:1.2s">✧</span>
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-text="moments.eyebrow"></span>
          <h2 data-text="moments.title"></h2>
        </div>
        <div class="chips" id="momentChips"></div>
      </div>
    </section>

    <!-- 5. KUSTOMISASI -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-text="custom.eyebrow"></span>
          <h2 data-text="custom.title"></h2>
          <p class="lead" data-text="custom.subtitle"></p>
        </div>
        <div class="custom-grid" id="customList"></div>
      </div>
    </section>

    <!-- 6. CARA PEMESANAN -->
    <section class="steps-section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-text="steps.eyebrow"></span>
          <h2 data-text="steps.title"></h2>
        </div>
        <div class="steps" id="stepList"></div>
      </div>
    </section>

    <!-- 7. HARGA -->
    <section>
      <div class="container">
        <div class="price-box reveal">
          <span class="eyebrow" data-text="price.eyebrow"></span>
          <h2 data-text="price.title"></h2>
          <p class="lead" data-text="price.text"></p>
          <a class="btn btn-gold js-wa" target="_blank" rel="noopener"><span data-text="price.cta"></span></a>
        </div>
      </div>
    </section>

    <!-- 8. CTA AKHIR -->
    <section class="final">
      <span class="sparkle" style="left:10%;top:24%;color:#e9d29a">✦</span>
      <span class="sparkle" style="right:12%;top:30%;color:#e9d29a;animation-delay:.8s">✦</span>
      <span class="sparkle" style="left:20%;bottom:18%;color:#e9d29a;animation-delay:1.6s">✧</span>
      <div class="container reveal">
        <h2 data-text="finalCta.title"></h2>
        <p data-text="finalCta.text"></p>
        <a class="btn btn-wa btn-lg js-wa" target="_blank" rel="noopener"><span class="wa-icon"></span><span data-text="finalCta.cta"></span></a>
      </div>
    </section>
  </main>

  <!-- 9. FOOTER -->
  <footer>
    <strong data-text="brandName"></strong>
    <span id="footerText"></span>
  </footer>

  <!-- tombol WhatsApp melayang (HP) -->
  <a class="float-wa js-wa" id="floatWa" target="_blank" rel="noopener" aria-label="Chat admin via WhatsApp">
    <span class="wa-icon"></span><span data-text="floatingCta"></span>
  </a>

<script>
(function () {
  const get = (path) => path.split(".").reduce((o, k) => (o ? o[k] : undefined), CONFIG);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // teks biasa & teks berformat (hanya untuk judul hero)
  document.querySelectorAll("[data-text]").forEach((el) => (el.textContent = get(el.dataset.text) ?? ""));
  document.querySelectorAll("[data-html]").forEach((el) => (el.innerHTML = get(el.dataset.html) ?? ""));
  document.title = `Game Interaktif Custom — ${CONFIG.brandName}`;

  // tautan WhatsApp
  const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(CONFIG.whatsappMessage)}`;
  const WA_SVG =
    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.6-.92-2.2-.24-.58-.48-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.08.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.05 21.5a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.57.93.95-3.48-.22-.36a9.38 9.38 0 0 1-1.44-5c0-5.19 4.23-9.42 9.43-9.42 2.52 0 4.88.98 6.66 2.76a9.36 9.36 0 0 1 2.76 6.67c0 5.2-4.23 9.42-9.42 9.42zm8.02-17.44A11.27 11.27 0 0 0 12.05.75C5.8.75.72 5.83.72 12.08c0 2 .52 3.95 1.52 5.66L.62 23.25l5.64-1.48a11.3 11.3 0 0 0 5.78 1.48c6.25 0 11.33-5.08 11.33-11.33 0-3.03-1.18-5.87-3.31-8z"/></svg>';
  document.querySelectorAll(".js-wa").forEach((a) => (a.href = waUrl));
  document.querySelectorAll(".wa-icon").forEach((s) => (s.outerHTML = WA_SVG));

  // video contoh
  const video = document.getElementById("demoVideo");
  video.src = encodeURI(CONFIG.video.src) + "#t=0.5";

  // kartu jenis game
  const ICONS = {
    cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7L12 2.5Z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4Z"/><path d="M10 10.5a2 2 0 1 1 3 1.7c-.7.4-1 .9-1 1.6M12 16v.01"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0v-14ZM20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0v-14Z"/><path d="m15 9 .6 1.2 1.4.2-1 1 .2 1.4-1.2-.7-1.2.7.2-1.4-1-1 1.4-.2L15 9Z"/></svg>',
  };
  document.getElementById("playCards").innerHTML = CONFIG.play.items
    .map((g, i) => `<div class="play-card reveal" data-delay="${i + 1}">
        <div class="top"><span class="icon">${g.emoji}</span><span><span class="tag">${g.tag}</span><h3>${g.title}</h3></span></div>
        <p>${g.text}</p>
        <a class="btn btn-gold" href="${g.href}" target="_blank" rel="noopener">▶ ${g.cta}</a>
      </div>`)
    .join("");

  document.getElementById("gameCards").innerHTML = CONFIG.games.items
    .map(
      (g, i) => `
      <article class="card reveal" data-delay="${i + 1}">
        <div class="icon">${ICONS[g.icon] || ICONS.heart}</div>
        <h3>${esc(g.title)}</h3>
        <p>${esc(g.text)}</p>
      </article>`
    )
    .join("");

  // chip momen
  document.getElementById("momentChips").innerHTML = CONFIG.moments.items
    .map((m, i) => `<span class="chip reveal" data-delay="${(i % 3) + 1}"><span>${esc(m.icon)}</span>${esc(m.label)}</span>`)
    .join("");

  // daftar kustomisasi
  document.getElementById("customList").innerHTML = CONFIG.custom.items
    .map((t, i) => `<div class="custom-item reveal" data-delay="${(i % 2) + 1}"><span class="check">✓</span>${esc(t)}</div>`)
    .join("");

  // langkah pemesanan
  document.getElementById("stepList").innerHTML = CONFIG.steps.items
    .map(
      (s, i) => `
      <div class="step reveal" data-delay="${i + 1}">
        <div class="num">${i + 1}</div>
        <h3>${esc(s.title)}</h3>
        <p>${esc(s.text)}</p>
      </div>`
    )
    .join("");

  // footer
  document.getElementById("footerText").textContent = `© ${CONFIG.year} ${CONFIG.brandName}. ${CONFIG.footer}`;

  // animasi muncul saat scroll
  const io = new IntersectionObserver(
    (entries) => entries.forEach((e) => e.isIntersecting && (e.target.classList.add("in"), io.unobserve(e.target))),
    { threshold: 0.15, rootMargin: "0px 0px -40px 0px" }
  );
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  // kelopak bunga berjatuhan (ringan)
  const petals = document.getElementById("petals");
  const count = window.innerWidth < 640 ? 8 : 14;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.style.left = `${(i * 37 + 7) % 100}%`;
    p.style.setProperty("--drift", `${(i % 2 ? 1 : -1) * (30 + (i % 4) * 20)}px`);
    p.style.animationDuration = `${11 + (i % 5) * 2.4}s`;
    p.style.animationDelay = `${(i * 1.3) % 12}s`;
    p.style.transform = `scale(${0.7 + (i % 3) * 0.25})`;
    petals.appendChild(p);
  }

  // tombol WhatsApp melayang muncul setelah melewati hero
  const floatWa = document.getElementById("floatWa");
  const onScroll = () => floatWa.classList.toggle("show", window.scrollY > window.innerHeight * 0.6);
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
